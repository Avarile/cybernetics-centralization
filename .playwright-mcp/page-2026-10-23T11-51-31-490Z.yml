    - generic [ref=e118]:
      - heading "# guides that use it" [level=2] [ref=e119]
      - list [ref=e120]:
        - listitem [ref=e121]:
          - link "Your first 30 minutes" [ref=e122] [cursor=pointer]:
            - /url: /guides/first-30-minutes
          - paragraph [ref=e123]: Build your Data Base from two schema packs, connect an AI, and ask your first question that only your own data can answer.
        - listitem [ref=e124]:
          - link "Capture anything with one sentence" [ref=e125] [cursor=pointer]:
            - /url: /guides/capture-anything
          - paragraph [ref=e126]: Save a short 'remember this' recipe in your AI, and every rambling message becomes tidy, linked records in the right place.
        - listitem [ref=e127]:
          - link "Your weekly review, from the record" [ref=e128] [cursor=pointer]:
            - /url: /guides/weekly-review
          - paragraph [ref=e129]: "Five minutes a week: what moved, what got stuck, what you didn't plan, and three priorities for next week, built from what actually happened."
        - listitem [ref=e130]:
          - link "Build a how-to library your agents follow" [ref=e131] [cursor=pointer]:
            - /url: /guides/how-to-library
          - paragraph [ref=e132]: Turn the things you've figured out into a tree of how-tos that you, Claude Code or Codex can look up, follow step by step, and improve each time.
        - listitem [ref=e133]:
          - link "See how your knowledge connects" [ref=e134] [cursor=pointer]:
            - /url: /guides/knowledge-graph
          - paragraph [ref=e135]: "Open your Data Base as a graph: every record a node, every link a line. Find the clusters, the orphans, and the notes your work leans on most."
        - listitem [ref=e136]:
          - link "Plan a goal into projects and tasks with an agent" [ref=e137] [cursor=pointer]:
            - /url: /guides/plan-a-goal
          - paragraph [ref=e138]: Describe what you want; your AI breaks it into a project and tasks using how you planned the last one, links the know-how each task needs, and asks before it creates anything.
        - listitem [ref=e139]:
          - link "Run cycles and get weekly reports drafted for you" [ref=e140] [cursor=pointer]:
            - /url: /guides/cycles-and-weekly-reports
          - paragraph [ref=e141]: Plan work in one- or two-week cycles, and let your AI draft the report from what actually happened in the cycle, then file it where you'll find it again.
        - listitem [ref=e142]:
          - 'link "Finish a project properly: the check step and the retro" [ref=e143] [cursor=pointer]':
            - /url: /guides/close-a-project
          - paragraph [ref=e144]: Nothing goes straight from doing to done. Add a check, run a short retro from the record, and make each lesson change a note, a template or a recipe.
        - listitem [ref=e145]:
          - link "Meeting prep and follow-ups that come back to you" [ref=e146] [cursor=pointer]:
            - /url: /guides/people-and-follow-ups
          - paragraph [ref=e147]: Keep who's who, what you talked about and what you promised in one place, get a prep sheet before every meeting, and have your promises come back before they're late.
        - listitem [ref=e148]:
          - link "Link records across modules" [ref=e149] [cursor=pointer]:
            - /url: /guides/link-records-across-modules
          - paragraph [ref=e150]: Attach the right notes and records to a client in the CRM or a work item in Project Management, so the context travels with the work.
        - listitem [ref=e151]:
          - link "Import bank statements and let an agent categorise them" [ref=e152] [cursor=pointer]:
            - /url: /guides/categorise-bank-statements
          - paragraph [ref=e153]: Export a statement, drop it into an inbox table, and let your AI sort each line into accounts, categories and payees, learning your rules as it goes.
        - listitem [ref=e154]:
          - link "Budgets and the money questions you avoid" [ref=e155] [cursor=pointer]:
            - /url: /guides/budgets-and-money-questions
          - paragraph [ref=e156]: Set a monthly budget per category, let the table work out what's spent and what's left, and ask your money questions out loud instead of opening a spreadsheet.
        - listitem [ref=e157]:
          - link "Build a custom agent with skills" [ref=e158] [cursor=pointer]:
            - /url: /guides/build-a-custom-agent
          - paragraph [ref=e159]: Create an agent in the Agentic Platform for one recurring job, give it your data through MCP and a skill that holds the method, and run it on whichever model you like.
        - listitem [ref=e160]:
          - link "Put the marketing agents to work" [ref=e161] [cursor=pointer]:
            - /url: /guides/marketing-agents
          - paragraph [ref=e162]: Fifty-two specialist marketing agents, from SEO audits to pricing to launch plans. They learn your business once, read your data, and track the work they commit to in your projects.
        - listitem [ref=e163]:
          - link "Set up a small team" [ref=e164] [cursor=pointer]:
            - /url: /guides/small-team-setup
          - paragraph [ref=e165]: One record the whole team can read, a key per person, shared how-tos that survive people leaving, and agents that work on the same board as everyone else.
